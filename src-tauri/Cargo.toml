[package]
name = "afterglow"
version = "0.1.0"
description = "A tiny GitHub Copilot credit meter for your menu bar"
authors = ["otherland"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
